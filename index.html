<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b1612" />
    <meta name="description" content="Gol-Razhkbur, stronghold of Clan Orgrimm: what we trade and what it costs." />
    <title>Clan Orgrimm · Gol-Razhkbur</title>
    <!-- What a pasted link shows in Discord and the like: the clan banner. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clan Orgrimm" />
    <meta property="og:title" content="Gol-Razhkbur · Clan Orgrimm" />
    <meta property="og:description" content="Stronghold of Clan Orgrimm: what we trade and what it costs." />
    <meta property="og:url" content="https://orgrimm-tracker.elthan.net/" />
    <meta property="og:image" content="https://orgrimm-tracker.elthan.net/og-banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The noticeboard's faces, chosen to look printed by hand on old paper:
         Pirata One for the big rough blackletter, IM Fell English (cut from
         17th-century type, ink-spread and uneven) for the words and its true
         small capitals. Grenze Gotisch is the tracker sidebar's name. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pirata+One&display=swap" />
    <!-- Apply the theme before first paint so there is no flash of the wrong
         one. Dark is the default; light is opt-in and remembered per browser.
         The sabertooth-* key is the pre-rename spelling, read as a fallback. -->
    <script>
      try {
        var t = localStorage.getItem('sabretooth-theme')
          || localStorage.getItem('sabertooth-theme');
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
