<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sabretooth Adventurers Guild</title>
    <!-- Apply the theme before first paint so there is no flash of the wrong
         one. Dark is the default; light is opt-in and remembered per browser.
         The sabertooth-* key is the pre-rename spelling, read as a fallback. -->
    <script>
      try {
        var t = localStorage.getItem('sabretooth-theme')
          || localStorage.getItem('sabertooth-theme');
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
