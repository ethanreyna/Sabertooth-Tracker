name = "sabretooth-tracker"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# Served from the guild's own domain. Wrangler creates and manages the DNS
# record for this hostname on deploy. The <name>.<account>.workers.dev URL stays
# enabled as a fallback.
[[routes]]
pattern = "sabretooth-tracker.elthan.net"
custom_domain = true

# Serve the Vite build. API paths hit the Worker first; everything else
# falls back to index.html so the SPA handles its own routing.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Guild database. Created with:  pnpm cf:d1:create
[[d1_databases]]
binding = "DB"
database_name = "sabertooth"
database_id = "eacd0c6a-5091-47f4-a8be-145a9109c047"

# Barrel location screenshots. Create with:  pnpm cf:r2:create
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "sabertooth-images"

# Market price list, pulled from a link-shared Google Sheet via /api/prices.
#
# PRICES_SHEET_TABS is a comma-separated list of "<gid>:<display label>".
# Addressing tabs by gid matters: the by-name endpoint (gviz) type-infers each
# column and silently blanks a text header sitting in a numeric column, which
# orphaned the "Price of 1" values. The gid-based CSV export returns the grid
# verbatim. Find a tab's gid by opening it and reading #gid=... from the URL.
[vars]
PRICES_SHEET_ID = "1i5_O_jqz2wPBBNUzjCk0gwMRBIdVdnbIc0BG1S-KMWQ"
PRICES_SHEET_TABS = "2094851253:BARS/ORES/WOOD,684884568:ARMOR/WEAPONS/TOOLS,963198346:BOOKS AND MAGIC,1241328953:TAILORING,339112539:FOOD,1812320419:ALCHEMY INGREDIENTS,0:POTIONS,1874240246:Copy of Sheet1"

# GUILD_PASSWORD is a secret, never committed. Set it with:
#   pnpm cf:secret
