name = "sabertooth-tracker"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# Serve the Vite build. API paths hit the Worker first; everything else
# falls back to index.html so the SPA handles its own routing.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Guild database. Create with:  pnpm cf:d1:create
# then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "sabertooth"
database_id = "PASTE_DATABASE_ID_HERE"

# Barrel location screenshots. Create with:  pnpm cf:r2:create
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "sabertooth-images"

# GUILD_PASSWORD is a secret, never committed. Set it with:
#   pnpm cf:secret
